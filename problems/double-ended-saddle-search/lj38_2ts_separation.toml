id = "double-ended-saddle-search/lj38_2ts_separation"
title = "lj38_2ts_separation"
suite = "double-ended-saddle-search"
problem = "lj38_2ts_separation"
contract = "partial"
entry_count = 2

# The archive does not state an image count or a force cap. Five interior
# images is the LJ38 double-ended band. The cap used here is 250000
# force calls.
[convergence]
norm = "l2"
force_norm = 0.001
max_force_calls = 250000

[band]
interior_images = 5
max_move = 0.05
potential = "lj"

[sample]
pairs = 51

[input]
archive_path = "website/double-ended-saddle-search/lj38_2ts_separation/coords.tgz"

[geometry]
kind = "xyz-pairs"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed", "transition_states"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the 2014 archive table."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
