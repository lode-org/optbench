id = "neb/Pt-heptamer"
title = "Pt-heptamer"
suite = "neb"
problem = "Pt-heptamer"
contract = "partial"
entry_count = 12

[convergence]
norm = "l2"
force_norm = 0.01
force_unit = "eV/Ang"
max_force_calls = 10000

[band]
interior_images = 8
max_move = 0.2
potential = "morse_pt"

[sample]
pairs = 13

[input]
archive_path = "website/neb/Pt-heptamer/eon-lbfgs/minima.tgz"

[geometry]
kind = "con-minima-pairs"

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_min"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the 2014 archive table."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
