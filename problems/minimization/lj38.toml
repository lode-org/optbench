id = "minimization/lj38"
title = "Lennard-Jones 38 clusters"
suite = "minimization"
problem = "lj38"
contract = "stated"
entry_count = 24

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 40.0
pair_style = "lj/cut/opt"

[sample]
starts = 1000
geometry = "cluster_%.4i.con"

[input]
archive_path = "website/minimization/lj38/lj38-clusters.tgz"

[convergence]
norm = "l2"
force_norm = 0.01
force_unit = "energy/distance"
max_force_calls = 10000

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_min", "nfailed"]

[scoring.archive]
failure = "total_force_calls >= max_force_calls"
force_calls = "mean of total_force_calls on the other runs, rounded with awk printf %.0f"

[scoring.run]
failure = "force norm above force_norm, or total_force_calls >= max_force_calls"

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the 2014 archive table."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
success = "harness force calls under the cap, the force norm at the stop, and vibrational Hessian index 0. The six rigid modes of the free cluster are removed before the count. A curvature counts as negative only below -max(force_norm, 1e-8*||H||_F, 1e-6). Energy and Kabsch RMSD are not applied: this file has no energy_tol, rmsd_tol, or per-start reference."

counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]

[reference_entry]
path = "archive/entries/minimization/lj38/eon-cg"
code = "Eon"
code_version = "r2025"
algorithm = "Conjugate Gradients"
