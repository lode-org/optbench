id = "mlopt/C2H4"
title = "C2H4"
suite = "mlopt"
problem = "C2H4"
contract = "shared"
entry_count = 6

[metrics]
required = ["mean_energy_rmse", "mean_epoch", "mean_force_rmse", "median_energy_rmse", "median_epoch", "median_force_rmse", "nfailed"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]

[units]
harness = "loss-gradient evaluations"
archive = "epochs"
source = "The archived mean_epoch is the benchmark website's Mean Epochs: mlrf0_optb.py -s averages the last epoch in each model's pyamff.log. optbench/n2p2_ml.py charges one loss-gradient evaluation before each Kalman epoch. No source equates a pyamff epoch with that count."
