id = "mlopt/emt-pt38"
title = "EMT Pt 38 nanoparticle"
suite = "mlopt"
problem = "emt-pt38"
contract = "stated"
entry_count = 6

[sample]
initializations = 50
initialization = "uniform[-1, 1)"
structure_source = "EMT molecular dynamics at 300 K"

[convergence]
max_epochs = 10000
energy_only_grad_norm = 0.02
force_training_grad_norm = 0.1

[input]
archive_path = "website/mlopt/emt-pt38/pt_md.traj"

[metrics]
required = ["mean_epoch", "median_epoch", "mean_energy_rmse", "median_energy_rmse", "mean_force_rmse", "median_force_rmse", "nfailed"]
website_said = ["mean_epochs", "median_epochs"]

[missing_force_rmse]
value = -1.0
meaning = "energies were trained and forces were not"

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the 2014 archive table."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
