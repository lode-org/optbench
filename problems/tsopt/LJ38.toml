id = "tsopt/LJ38"
title = "LJ38"
suite = "tsopt"
problem = "LJ38"
contract = "partial"
entry_count = 8

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 40.0
pbc = [false, false, false]

[sample]
starts = 200
geometry = "coords-con/%.4d.con"

[input]
archive_path = "website/tsopt/LJ38/coords-con.tar.gz"

[convergence]
norm = "l2"
force_norm = 0.001
force_unit = "energy/distance"
max_force_calls = 10000

[metrics]
required = ["force_calls", "force_calls_max", "force_calls_median", "force_calls_min", "nfailed"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays on the 2014 archive table."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
success = "harness force calls under the cap, Euclidean force norm at the stop, and Hessian index 1"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
