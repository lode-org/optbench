id = "globalopt/lj98"
title = "lj98"
suite = "globalopt"
problem = "lj98"
contract = "shared"
entry_count = 2
remark = "Success is an energy at or below the Cambridge Cluster Database N=98 minimum plus 0.001. The start set is the 100 numbered coordinate files. The cap is this file's convergence.max_force_calls, 1000000000."

[potential]
kind = "lennard-jones"
epsilon = 1.0
sigma = 1.0
cutoff = 40.0

[reference]
energy = -543.665361
symmetry = "Td"
page = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/tables.150.html"
points = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/points/98"

[sample]
starts = 100

[convergence]
energy_above_minimum = 0.001
max_force_calls = 1000000000

[input]
archive_path = "website/globalopt/lj98/lj98_clusters.tgz"

[metrics]
required = ["basin_hopping_steps_mean", "basin_hopping_steps_stddev", "cpu_time_mean", "cpu_time_stddev", "energy_calls_mean", "energy_calls_stddev", "nfailed"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]

[units]
archive = "quenches"
source = "The archived basin_hopping_steps_mean is the benchmark website's mean Q. That page benchmarks these entries on the number of quenches [Q] and the number of energy steps [V]. The harness rows count force calls, and no source equates an energy step with a force call."
