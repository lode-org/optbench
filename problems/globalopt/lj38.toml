id = "globalopt/lj38"
title = "Lennard-Jones 38 global minimum"
suite = "globalopt"
problem = "lj38"
contract = "stated"
entry_count = 5
remark = "Success is an energy at or below the Cambridge Cluster Database N=38 minimum plus 0.001. The cap of 2000000 force calls is the cap the ranked eOn and GMIN rows already record. The 2014 eOn config states no force-call cap, and its benchmark.dat records an observed force_calls_max of 1795901."

[sample]
starts = 100

[convergence]
energy_above_minimum = 0.001
max_force_calls = 2000000

[reference]
energy = -173.928427
symmetry = "Oh"
page = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/tables.150.html"
points = "https://www-wales.ch.cam.ac.uk/~jon/structures/LJ/points/38"

[input]
archive_path = "website/globalopt/lj38/100_lj38.tar.gz"

[metrics]
required = ["force_calls", "force_calls_min", "force_calls_max", "nfailed"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
