id = "globalopt/lj100-binary"
title = "Binary Lennard-Jones 100"
suite = "globalopt"
problem = "lj100-binary"
contract = "stated"
entry_count = 2
remark = "The 100 starts are quenched random clusters packed as the other globalopt start sets are: packing fraction 0.1, a neighbor distance between 0.8 and 1.3 covalent radii, then a shift to the center of a cubic cell of side 100. The draw uses seed 1. Component 1 is species B, symbol H, 58 atoms, sigma 1.3. Component 2 is species A, symbol C, 42 atoms, sigma 1.0. The unlike sigma is the arithmetic mean. Each cluster is quenched with L-BFGS-B until the maximum force component is below 1e-4 on the unshifted lj/cut potential, cutoff 20. A start succeeds at or below energy_minimum plus 0.001. The force-call cap is max_evaluations, 2000000."

[potential]
kind = "binary-lennard-jones"
n_A = 42
n_B = 58
symbol_A = "C"
symbol_B = "H"
epsilon_AA = 1.0
epsilon_AB = 1.0
epsilon_BB = 1.0
sigma_AA = 1.0
sigma_BB = 1.3
sigma_AB = "arithmetic mean of sigma_AA and sigma_BB"
energy_minimum = -604.796307

[sample]
starts = 100
max_evaluations = 2000000

[convergence]
energy_above_minimum = 0.001
max_force_calls = 2000000

[input]
archive_path = "website/globalopt/lj100-binary/lj100-binary-a42b58.tgz"

[metrics]
required = ["avg_energy", "min_energy", "max_energy"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
