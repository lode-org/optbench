id = "hTST/Pt"
title = "Pt"
suite = "hTST"
problem = "Pt"
contract = "partial"
entry_count = 11
remark = "A start is one barrier window. The window closes when each reference barrier has been matched once. Force calls are the harness tally for that window. The rank uses PAR-2 on that cap. A missing rate window does not drop a finished barrier window. The 2014 Pt archive used shifted Morse."

[convergence]
max_force_calls = 20000000

[sample]
starts = 13

[metrics]
required = ["barrier_force_calls", "barrier_jobs", "rate_force_calls", "rate_jobs"]

[scoring.legacy]
label = "legacy"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row stays labelled legacy."

[scoring.v2]
version = "par2-wilson-bootstrap"
par_factor = 2
bootstrap_resamples = 2000
bootstrap_seed = 20261015
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "wilson_low",
  "wilson_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
