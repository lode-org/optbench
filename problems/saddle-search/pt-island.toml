id = "saddle-search/pt-island"
title = "Pt heptamer island"
suite = "saddle-search"
problem = "pt-island"
contract = "stated"
entry_count = 12

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
cutoff = 9.5
pair_style = "morse/smooth/linear"
pbc = [true, true, false]

[goal]
connected_saddles = 27
barrier_below_eV = 1.5

# The goal is a count of eOn processes: done.py counts good results, and
# eOn judges a result with its [Structure Comparison] defaults. Those are
# distance_difference 0.1 angstrom and energy_difference 0.01 eV. The
# archived config.ini sets neither, so the defaults are the problem's.
[connection]
distance_difference = 0.1
energy_difference = 0.01

[convergence]
norm = "l2"
force_norm = 1.0e-3
force_unit = "eV/Angstrom"

[input]
geometries = [
  "website/saddle-search/pt-island/pt-island.con",
  "website/saddle-search/pt-island/POSCAR_pt_island",
]

[metrics]
required = ["force_calls", "force_calls_mean_error", "fraction_connected", "total_searches", "unique_saddles"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
cost = "one displacement search: the climb plus the two endpoint minimizations"
success = "index 1 at eigenvalue tolerance 1e-6, force norm at the stop, barrier below 1.5 eV, and exactly one minimized endpoint the same structure as the minimized minimum. Two structures are the same when every atom is closer than distance_difference to its own position in the other (minimum image, atoms by index), as eOn Matter::compare. A connected saddle within energy_difference of the barrier of a connected saddle already found, and the same structure as it, is a repeat (eOn AKMCState.find_repeat). Only connected saddles enter that table."
note = "The result file stores the cap. An rgsaddle search is bounded by SaddleSearch.max_iterations min-mode steps at the most force calls one step can spend, and two endpoint minimizations of Optimizer.max_iterations calls each, as the 2014 eOn bounds a search. A SoftSaddle search is bounded by climb budget 1000, 64 calls of overshoot, and two endpoint budgets of 2000. The initial minimization is outside that count. An index-1 saddle whose endpoint minimization does not converge, or that misses the link, the repeat test, or the barrier, is a failure, and those reasons fall through to divergence. An archived file that records only a campaign ratio has no per-search cap, so PAR-2 is not applied to that ratio."
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]

[units]
harness = "force calls per search"
archive = "force calls per campaign"
source = "The cost in the v2 scoring table is one displacement search. The archived force_calls is the mean over campaigns of each campaign's total: done.py and get_data_for_web_benchmark.m add every search until the campaign ends, and the benchmark website's Nf is the total number of force calls. force_calls / total_searches is the mean cost of one search, but the archive states no per-search cap. The PAR-2 that ranks the harness rows needs one, so the archived rows keep their own unit."
