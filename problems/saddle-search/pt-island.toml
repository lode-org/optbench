id = "saddle-search/pt-island"
title = "Pt heptamer island"
suite = "saddle-search"
problem = "pt-island"
contract = "stated"
entry_count = 12

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
cutoff = 9.5
pair_style = "morse/smooth/linear"
pbc = [true, true, false]

[goal]
connected_saddles = 27
barrier_below_eV = 1.5

[connection]
distance_difference = 0.1
energy_difference = 0.01

[convergence]
norm = "l2"
force_norm = 1.0e-3
force_unit = "eV/Angstrom"

[input]
geometries = [
  "website/saddle-search/pt-island/pt-island.con",
  "website/saddle-search/pt-island/POSCAR_pt_island",
]

[metrics]
required = ["force_calls", "force_calls_mean_error", "fraction_connected", "total_searches", "unique_saddles"]

[scoring.half_even]
label = "half-even"
rule = "2014 half-even mean of the starts under the cap. Failures are left out of that mean. The row keeps that mean as its published number."

[scoring.v2]
version = "par2-bootstrap"
cost = "one displacement search: the climb plus the two endpoint minimizations"
success = "index 1 at eigenvalue tolerance 1e-6, force norm at the stop, barrier below 1.5 eV, and exactly one minimized endpoint the same structure as the minimized minimum. Two structures are the same when every free atom moved less than distance_difference 0.1 angstrom (minimum image, atoms by index), as eOn Matter::compare. A saddle within energy_difference 0.01 eV and the same per-atom test of an earlier connected saddle is a repeat (eOn AKMCState.find_repeat)."
note = "The result file stores the cap: climb budget 1000, 64 calls of overshoot, and two endpoint budgets of 2000. The initial minimization is outside that count. An index-1 saddle that misses the link, the novelty test, or the barrier is a failure, and those reasons fall through to divergence. An archived file that records only a campaign ratio has no per-search cap, so PAR-2 is not applied to that ratio."
counter = "harness"
required = [
  "schema",
  "counter",
  "force_calls",
  "success",
  "failure",
  "comparable",
  "code",
  "code_version",
  "commit",
  "tuning",
  "par2_mean",
  "median",
  "median_low",
  "median_high",
  "rate_low",
  "rate_high",
  "n",
  "nfailed",
  "n_cap",
  "n_wrong_stationary",
  "n_divergence",
  "n_crash",
]
