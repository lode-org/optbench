name: board-plots

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: board-plots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: board plots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Render board plots
        run: uv run optbench board render

      - uses: actions/upload-artifact@v4
        with:
          name: board-plots
          path: |
            results/board/plots/*.png
            results/board/plots/*.webp
            docs/source/_static/board/*.png
            docs/source/_static/board/*.webp
          if-no-files-found: error
