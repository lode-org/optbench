name: asv

on:
  push:
    branches:
      - main
      - "design/**"
      - "entries/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: asv-compare
    runs-on: ubuntu-latest
    # asv copies its environment into the benchmark server, and the server loads numpy before any benchmark module.
    # These are optbench.blas_threads.PINNED.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
          python-version: "3.12.3"
          enable-cache: true

      - name: Compare base and head on this runner
        env:
          OPTBENCH_ASV_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          OPTBENCH_ASV_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OPTBENCH_ASV_MACHINE: optbench-ci
        run: |
          uv python install 3.12.3
          uv sync --frozen --group dev
          uvx --from snakemake==9.14.1 snakemake --cores 1 asv_compare

      - name: Gate report is present
        id: report
        if: always()
        run: |
          if [ -f results/asv-ci/compare.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload comparison text
        if: always() && github.event_name == 'pull_request' && steps.report.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asv-compare-${{ github.run_id }}
          path: results/asv-ci/compare.txt
          retention-days: 1

      - name: Gate
        if: always()
        run: |
          uv run python -c 'import json, pathlib, sys; path = pathlib.Path("results/asv-ci/gate.json"); decision = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else sys.exit("results/asv-ci/gate.json is missing"); sys.exit(0 if decision.get("regression") is False else "the gate reported a regression")'
