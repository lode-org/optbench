# How many runs an archived mean covers, where benchmark.dat does not say.
# The board reads n from here. optbench check fails when an entry is
# missing, counted twice, or states its own count.
# Each source is a file in that entry's archive directory, or in the code
# file the entry names. tests/test_counts.py reads those files again.

[[count]]
path = "website/saddle-search/pt-island/eon-dimer-cg-20-rotations/benchmark.dat"
n = 9
counted = "campaigns"
source = "calc_benchmarks.py lists nine per-campaign values of force_calls, unique_saddles, fraction_connected and total_searches, and benchmark.dat holds their averages."

