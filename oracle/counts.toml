source = "run.sh starts run-1 to run-10. report.sh runs done.py only in run-? (run-1 to run-9) and averages run-*/benchmark.dat with awk, which prints six significant digits. done.py prints whole numbers, and of one to ten campaigns only nine fits both means: unique_saddles 51.6667 is 465/9 and total_searches 800.222 is 7202/9."

