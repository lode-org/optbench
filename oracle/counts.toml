[[count]]
path = "website/saddle-search/pt-island/eon-dimer/benchmark.dat"
n = 9
counted = "campaigns"
source = "run.sh starts run-1 to run-10. report.sh runs done.py only in run-? (run-1 to run-9) and averages run-*/benchmark.dat with awk, which prints six significant digits. done.py prints whole numbers, and of one to ten campaigns only nine fits both means: unique_saddles 109.222 is 983/9 and total_searches 11366.8 is 102301/9."

