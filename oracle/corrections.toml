# Archived fields that the entry's own run script contradicts.
# The board reads value where the archive has was. optbench check fails
# when the archive no longer has was.
#
# The eight GMAN NEB files all say algorithm lbfgs. Each opt.py runs one
# optimizer. The names are the rows of Table I in D. Sheppard, R. Terrell
# and G. Henkelman, J. Chem. Phys. 128, 134106 (2008), which every GMAN
# comments.txt cites.

[[correction]]
path = "website/neb/Pt-heptamer/gman-sd/benchmark.dat"
field = "algorithm"
was = "lbfgs"
value = "SD"
source = "opt.py runs Gopt.sd(). J. Chem. Phys. 128, 134106 (2008), Table I, SD: steepest descent."

[[correction]]
path = "website/neb/Pt-heptamer/gman-qm/benchmark.dat"
field = "algorithm"
was = "lbfgs"
value = "QM"
source = "opt.py runs Gopt.qm(). J. Chem. Phys. 128, 134106 (2008), Table I, QM: quick-min."

