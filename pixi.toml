[workspace]
name = "optbench"
# Generated from pyproject.toml by cog (https://nedbatchelder.com/code/cog/).
# https://pixi.prefix.dev/latest/reference/pixi_manifest/#version-optional
# [[[cog
# from optbench.project_version import cog_out
# cog_out(cog, 'version = "{version}"')
# ]]]
version = "0.0.0"
# [[[end]]]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
uv = ">=0.8"

[tasks]
test = "uv run pytest"
check = "uv run optbench check"
campaign = "uv run optbench run"

[environments]
docs = { features = ["docs"] }

[feature.docs]
platforms = ["linux-64"]

[feature.docs.dependencies]
python = "3.12.*"
sphinx = ">=8.2,<9"
emacs = ">=30.2,<31"

[feature.docs.pypi-dependencies]
shibuya = ">=2026.1.9,<2027"

[feature.docs.tasks]
tables = { cmd = "uv run python -m optbench.site" }
rst = { cmd = "emacs --batch --load docs/export.el" }
html = { cmd = "sphinx-build -d docs/doctrees docs/source docs/build", depends-on = ["tables", "rst"] }
sitesize = { cmd = "uv run optbench sitesize" }
