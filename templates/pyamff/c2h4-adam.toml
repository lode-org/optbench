note = "PyAMFF 0.1.0-beta at 240f51d01ca22969369f9bc21760c61cbb3b6665 (2026-07-04). Stock Adam from that release on the archived config: 10-7 tanh, NoScaler, SSE (the release name for the archived SE loss), learning rate 0.01, force coefficient 0.0. Fifty unseeded uniform[-1, 1) starts. init_model_parameters is true because this revision opens saved_model_params.pyamff when the flag is false. The stop is this archive row's own rule: every parameter gradient component below 0.02, cap 10000. One harness call is one loss-and-gradient evaluation. A capped start scores twice the cap."

