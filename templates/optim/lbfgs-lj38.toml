# OPTIM L-BFGS on LJ38 through the ASE socket.
id = "optim/lbfgs-lj38"
engine = "optim"
problem = "minimization/lj38"
code = "optim"
code_version = "latest"
commit = "latest"
algorithm = "L-BFGS"
tuning = "default"
note = "ASE socket. BFGSMIN RMS stop is the Euclidean force norm over sqrt(3N). UPDATES 4, MAXSTEP 0.2, STEPS equal to the cap. Each COMPUTE is one harness call. Hessian index 0 is required."

[optim]
method = "lbfgs"
updates = 4
maxstep = 0.2
