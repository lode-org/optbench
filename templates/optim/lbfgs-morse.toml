# OPTIM L-BFGS on periodic Morse bulk through the ASE socket.
id = "optim/lbfgs-morse"
engine = "optim"
problem = "minimization/morse-bulk"
code = "optim"
code_version = "latest"
commit = "latest"
algorithm = "L-BFGS"
tuning = "default"
note = "ASE socket, FIXCELL PBC. BFGSMIN RMS stop is the Euclidean force norm over sqrt(3N). UPDATES 4, MAXSTEP 0.2, STEPS equal to the cap. Each COMPUTE is one harness call. Hessian index 0 is required. Translations are projected and rotations stay."

[optim]
method = "lbfgs"
updates = 4
maxstep = 0.2
