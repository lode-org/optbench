note = "Dimer CG on the Al reactant. The archived config sets confidence 1.95, displace_radius 3.3, displace_magnitude 0.5, max_energy 100, listed-atom weight 1, prefactor 1.2e12, minimize_first, optimizer force 0.001 and max_iterations 5000, and num_jobs 10000. The dimer block is CG, 50 rotations, angle 1. The archived displace_atomlist value -1 is the last atom on the r2549 server. On this client that same value selects every free atom, so the list is file-order row 384, the last atom in the reactant. The names displace_listed_atom_weight and displace_atom_list are the keys this server accepts for the archived displace_listed_weight and displace_atomlist. The kernel is the Fortran Aluminum EAM through ext_pot. The client is eOn develop 500350d9. A window closes by the 2014 report rule once the processtable holds the eight reference barriers. The search stops at 10000 registered searches or when 639 barrier windows and 20 rate windows have closed."

[ini.Main]
