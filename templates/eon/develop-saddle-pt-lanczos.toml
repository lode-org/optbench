id = "eon/develop-saddle-pt-lanczos"
engine = "eon"
problem = "saddle-search/pt-island"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "Lanczos"
reducer = "akmc-until-27"
failure_cap = 100000000
ranked = false
note = "AKMC on the Pt island until 27 good saddles below 1.5 eV. Same thermostat, displacement list, prefactor, and L-BFGS translation as eon/develop-saddle-pt-dimer. The minimum mode is Lanczos, tolerance 0.001, max_iterations 20, quit_early true. Force calls are sad-fcs plus mins-fcs. Seeds are 1000 and 1001. pass_limit 250 stops a repetition that has not reached 27. A repetition that stops there stays out of the mean."

pass_limit = 250

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Lanczos]
tolerance = 0.001
max_iterations = 20
quit_early = true

[ini.LBFGS]
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_auto_scale = true
