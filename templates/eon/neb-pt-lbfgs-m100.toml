id = "eon/neb-pt-lbfgs-m100"
engine = "eon"
problem = "neb/Pt-heptamer"
code = "eOn"
code_version = "3.6.0"
commit = "1d71c944501832bfafb955ffe13b9aae50c8efd4"
algorithm = "LBFGS"
reducer = "report-neb"
kernel = "morse_cluster"
failure_cap = 10000
note = "Tuned L-BFGS climbing-image NEB. Memory 100 is the only change from eon/neb-pt-lbfgs. force_calls is the force_calls_neb band total across the 8 images. force_calls_per_image divides that total by 8."

[ini.Main]
job = "nudged_elastic_band"

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.01
max_move = 0.2
max_iterations = 1000

[ini."Nudged Elastic Band"]
images = 8
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = true
climbing_image_band_slack = 10.0
doubly_nudged = false
doubly_nudged_switching = false
old_tangent = false
opt_method = "lbfgs"
converged_force = 0.01
max_iterations = 1000
setup_mmf_peaks = true

[ini.LBFGS]
lbfgs_memory = 100
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true
lbfgs_curvature = "reset"
lbfgs_project_rigid = false
lbfgs_secant = "standard"
lbfgs_precon = "none"
lbfgs_step = "lbfgs"
lbfgs_h0 = "sy_yy"
lbfgs_accept = "energy"
lbfgs_extra_updates = 0
lbfgs_cautious_eps = 1.0e-6
lbfgs_cautious_alpha = 0.01
lbfgs_precon_A = 3.0
lbfgs_precon_mu = 1.0
lbfgs_precon_rcut = 0.0
