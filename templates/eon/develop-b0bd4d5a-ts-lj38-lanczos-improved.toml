note = """Lanczos improved L-BFGS on the 200 LJ38 starts. The stops match eon-svn/ts-lj38-lanczos-improved: tolerance 0.01, max_iterations 50, quit_early true, max_energy 1000, max_move 0.1. Optimizer max_iterations and the harness cap are 10000, the problem cap. The kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40."""

