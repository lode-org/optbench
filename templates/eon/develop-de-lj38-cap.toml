id = "eon/develop-de-lj38-cap"
engine = "eon"
problem = "double-ended-saddle-search/lj38"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "LBFGS"
method = "CI-NEB lj/cut"
tuning = "r2549-ini"
reducer = "report-capped"
kernel = "lj_cut"
failure_cap = 2500
note = "Develop binary 7095b23 with the r2549 climbing-image ini. Five images, L-BFGS memory 20, max_move 0.05, max_iterations 8000, converged_force 0.001. The force budget is 2500. Potential lammps with the archived in.lammps. Main random_seed is 1. The L-BFGS keys r2549 reads sit in [Optimizer]. energy_weighted, ci_mmf, climbing_image_band_slack, setup_mmf_peaks, and lbfgs_accept are omitted. A missing lbfgs_accept stays the generated SSOT default none. The energy line-search row is eon/develop-de-lj38-cap-accept-energy."

[ini.Main]
job = "nudged_elastic_band"
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.05
max_iterations = 8000
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true

[ini."Nudged Elastic Band"]
images = 5
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = true
old_tangent = false
doubly_nudged = false
doubly_nudged_switching = false
converged_force = 0.001
max_iterations = 8000
