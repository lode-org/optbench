doubly_nudged = false
doubly_nudged_switching = false
old_tangent = false
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 8000
setup_mmf_peaks = true
energy_weighted = false
ci_mmf = false

[ini.LBFGS]
