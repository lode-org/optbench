id = "eon/develop-de-lj38-cap-accept-energy"
engine = "eon"
problem = "double-ended-saddle-search/lj38"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "LBFGS"
method = "CI-NEB accept energy"
tuning = "accept-energy"
reducer = "report-capped"
kernel = "lj_cut"
failure_cap = 2500
note = "Same climbing-image NEB as eon/de-lj38-lbfgs, with max_iterations 8000 on the optimizer and the band. The force budget is 2500, the LJ38 double-ended cap. The harness refuses the call that would pass it, and that run is a cap failure. Energy-weighted springs and ci_mmf stay off. Potential lammps with the archived in.lammps. Main random_seed is 1. The energy line-search variant. lbfgs_accept is energy. The r2549-equivalent ini, with that key omitted, is eon/develop-de-lj38-cap."

[ini.Main]
job = "nudged_elastic_band"
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.05
max_iterations = 8000

[ini."Nudged Elastic Band"]
images = 5
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = true
