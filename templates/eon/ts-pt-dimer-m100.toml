id = "eon/ts-pt-dimer-m100"
engine = "eon"
problem = "tsopt/pt-island"
code = "eOn"
code_version = "3.6.0"
commit = "1d71c944501832bfafb955ffe13b9aae50c8efd4"
algorithm = "LBFGS"
reducer = "report-capped"
kernel = "client"
failure_cap = 10000
note = "Tuned L-BFGS dimer. Memory 100 is the only change from eon/ts-pt-dimer."

[ini.Main]
job = "saddle_search"
finite_difference = 0.001

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1

[ini.Dimer]
opt_method = "cg"
improved = true
finite_angle = 0.005
converged_angle = 5.0
rotations_max = 10
rotations_min = 1

[ini.LBFGS]
lbfgs_memory = 100
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true
lbfgs_curvature = "reset"
lbfgs_project_rigid = false
lbfgs_secant = "standard"
lbfgs_precon = "none"
lbfgs_step = "lbfgs"
lbfgs_h0 = "sy_yy"
lbfgs_accept = "energy"
lbfgs_extra_updates = 0
lbfgs_cautious_eps = 1.0e-6
lbfgs_cautious_alpha = 0.01
lbfgs_precon_A = 3.0
lbfgs_precon_mu = 1.0
lbfgs_precon_rcut = 0.0
