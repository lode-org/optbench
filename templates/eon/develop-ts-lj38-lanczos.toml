id = "eon/develop-ts-lj38-lanczos"
engine = "eon"
problem = "tsopt/LJ38"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "Lanczos"
reducer = "report-capped"
kernel = "ljcluster"
failure_cap = 10000
note = "Lanczos minimum mode and conjugate-gradient translation on the 200 LJ38 starts. Lanczos tolerance 0.02, 15 iterations, quit_early true. Optimizer max_move 0.35, max_iterations 1000, converged_force 0.001. Potential ljcluster. client_displace_type load. direction.dat is Python random.Random(index), three draws in [0, 1) per atom. Main random_seed is 1. The mean keeps total_force_calls under 10000. GPR-dimer is not in this build."

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini.Optimizer]
opt_method = "cg"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.35
max_iterations = 1000

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1

[ini.Lanczos]
tolerance = 0.02
max_iterations = 15
quit_early = true
