note = "OCI-NEB on all 51 lj38_2ts_separation pairs. ci_mmf true, ci_mmf_after 0.5, ci_mmf_nsteps 1000, energy_weighted false. xyz is converted to a centered free-cluster con. Potential ljcluster. Five images, max_move 0.05, max_iterations 2000. transition_states counts pairs whose number_of_extrema is at least 2. Main random_seed is 1. The problem run limit is 10000, the same cap as eon-svn/de-2ts-neb and the rgsaddle rows. An earlier draft of this file used 100000, which counted traces above 10000 as successes."

