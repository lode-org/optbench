id = "eon/develop-saddle-pt-dimer"
engine = "eon"
problem = "saddle-search/pt-island"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "Dimer"
reducer = "akmc-until-27"
failure_cap = 100000000
ranked = false
note = "AKMC on the Pt island until 27 good saddles below 1.5 eV. Confidence 1.1 with confidence_scheme old does not leave state 0. Prefactor default_value 5e12 skips the Hessian. Force calls are sad-fcs plus mins-fcs through the 27th qualifying line of states/0/search_results.txt. Prefactor calls are not included. Classic dimer, improved false, rotations_max 20, converged_angle 5, rotation steepest descent. Optimizer L-BFGS, max_move 0.2, max_iterations 1000, converged_force 0.001. Displacement is restricted to atoms 0-6, radius 3.3, magnitude 0.1. Potential morse_pt. Temperature 700 K. Each repetition uses Main random_seed 1000 plus the repetition index. Communicator num_jobs 32 and number_of_CPUs is the worker count. The server LBFGS catalog has memory, inverse curvature, and auto scale. Memory is 20. pass_limit 800 stops a repetition that has not reached 27."

pass_limit = 800

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "dimer"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Dimer]
improved = false
opt_method = "sd"
converged_angle = 5.0
rotations_max = 20
rotations_min = 1
finite_angle = 0.005

[ini.LBFGS]
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_auto_scale = true
