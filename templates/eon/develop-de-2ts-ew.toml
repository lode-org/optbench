id = "eon/develop-de-2ts-ew"
engine = "eon"
problem = "double-ended-saddle-search/lj38_2ts_separation"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "LBFGS"
reducer = "report-capped"
kernel = "ljcluster"
failure_cap = 250000
note = "Climbing-image NEB with energy-weighted springs on all 51 lj38_2ts_separation pairs. energy_weighted true, ew_trigger 10, ew_ksp_min 0.972, ew_ksp_max 9.72, ci_mmf false. xyz is converted to a centered free-cluster con. Potential ljcluster. Five images, max_move 0.05, max_iterations 2000. transition_states counts pairs whose number_of_extrema is at least 2. Main random_seed is 1. The problem run limit is 250000. An earlier draft of this file used 100000, which counted traces above 10000 as successes."

[ini.Main]
job = "nudged_elastic_band"
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.05
max_iterations = 2000

[ini."Nudged Elastic Band"]
images = 5
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = true
climbing_image_band_slack = 10.0
doubly_nudged = false
doubly_nudged_switching = false
old_tangent = false
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 2000
setup_mmf_peaks = true
energy_weighted = true
ew_trigger = 10.0
ew_ksp_min = 0.972
ew_ksp_max = 9.72
ci_mmf = false

[ini.LBFGS]
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true
lbfgs_curvature = "reset"
lbfgs_project_rigid = false
lbfgs_secant = "standard"
lbfgs_precon = "none"
lbfgs_step = "lbfgs"
lbfgs_h0 = "sy_yy"
lbfgs_accept = "energy"
lbfgs_extra_updates = 0
lbfgs_cautious_eps = 1.0e-6
lbfgs_cautious_alpha = 0.01
lbfgs_precon_A = 3.0
lbfgs_precon_mu = 1.0
lbfgs_precon_rcut = 0.0
