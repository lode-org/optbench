id = "eon/develop-ts-pt-lanczos"
engine = "eon"
problem = "tsopt/pt-island"
code = "eOn"
code_version = "3.6.0"
commit = "7095b23ac17d49f434a5e08ccb072897ceca698e"
algorithm = "Lanczos"
reducer = "report-capped"
kernel = "morse_cluster"
failure_cap = 10000
note = "Same Lanczos and conjugate-gradient settings as eon/develop-ts-lj38-lanczos, on the 49 Pt-island starts. Potential morse_pt. max_move 0.35. pos.con is reactant.con. displacement.con is initial_N.con. direction.dat is that displacement minus the reactant, divided by its norm. client_displace_type load. Main random_seed is 1. The mean keeps total_force_calls under 10000."

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "cg"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.35
max_iterations = 1000

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1

[ini.Lanczos]
tolerance = 0.02
max_iterations = 15
quit_early = true
