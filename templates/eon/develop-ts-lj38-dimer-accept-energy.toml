id = "eon/develop-ts-lj38-dimer-accept-energy"
engine = "eon"
problem = "tsopt/LJ38"
code = "eOn"
code_version = "(develop 8f3119a2)"
commit = "8f3119a22a7120814c54a5811c7a3aa59be0fd4e"
algorithm = "LBFGS"
tuning = "accept-energy"
reducer = "report-capped"
kernel = "ljcluster"
failure_cap = 10000
note = "Improved dimer on develop, same stops as eon/ts-lj38-dimer. Memory 20, translation L-BFGS max_move 0.1, max_iterations 3000, converged_force 0.001. Dimer rotation is conjugate gradient, converged_angle 0.1, rotations_max 20, improved true. Potential ljcluster. client_displace_type load. direction.dat is Python random.Random(index). Main random_seed is 1. The 1d71c94 row did not set a seed. The mean keeps total_force_calls under 10000. The energy line-search variant. lbfgs_accept is energy. The r2549-equivalent ini, with that key omitted, is eon/develop-ts-lj38-dimer."

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.1
max_iterations = 3000

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 3000
displace_magnitude = 0.1

[ini.Dimer]
opt_method = "cg"
improved = true
finite_angle = 0.005
converged_angle = 0.1
rotations_max = 20
rotations_min = 1

[ini.LBFGS]
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true
lbfgs_curvature = "reset"
lbfgs_project_rigid = false
lbfgs_secant = "standard"
lbfgs_precon = "none"
lbfgs_step = "lbfgs"
lbfgs_h0 = "sy_yy"
lbfgs_accept = "energy"
lbfgs_extra_updates = 0
lbfgs_cautious_eps = 1.0e-6
lbfgs_cautious_alpha = 0.01
lbfgs_precon_A = 3.0
lbfgs_precon_mu = 1.0
lbfgs_precon_rcut = 0.0
