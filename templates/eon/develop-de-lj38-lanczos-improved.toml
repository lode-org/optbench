id = "eon/develop-de-lj38-lanczos-improved"
engine = "eon"
problem = "double-ended-saddle-search/lj38"
code = "eOn"
code_version = "eOn (develop 500350d9)"
commit = "500350d9fae881f06c7ef194e5868da079c4be5a"
algorithm = "Lanczos improved L-BFGS"
reducer = "harness"
failure_cap = 2500
kind = "de-lj38-mode"
kernel = "lj40"
asv_class = "EonDevelopDeLj38LanczosImproved"
seeds = [1]
asv_timeout = 3600
budget_seconds = 3600
note = """Lanczos improved L-BFGS from the interpolated LJ38 midpoint. min_mode_method is lanczos, client_displace_type is load, and the optimizer is lbfgs. converged_force is 0.001. Optimizer max_iterations and the harness cap are 2500. Saddle Search max_energy is 1e9, Lanczos max_iterations is 20, and Lanczos tolerance is 0.05, from archive/entries/double-ended-saddle-search/lj38/eon-lanczos-improved/config.ini. That ini does not set finite_difference, so the client default 0.01 stays. The kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40."""

[ini.Main]
job = "saddle_search"

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 2500

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
max_energy = 1e9

[ini.Lanczos]
max_iterations = 20
tolerance = 0.05
