note = '''
Stock eOn built from develop b0bd4d5a, the merge of pull request 784. The client version string is 3.6.0. The force-call cap is 2000000. That number is max_force_calls in problems/globalopt/lj100-binary.toml. A start that reaches the cap is charged 4000000. The ini is the archive config.ini: temperature 14000, 60000 basin-hopping steps, displacement 0.3 (the archive names this max_displacement; the client reads displacement), gaussian draws, significant_structure, swap_probability 0, L-BFGS, converged_force 0.001, max_iterations 10000. random_seed is 1. The harness counts every ext_pot force call and stops at the cap. Component 1 is 58 atoms of sigma 1.3 and component 2 is 42 atoms of sigma 1.0. The unlike sigma is 1.15, epsilon is 1, the cutoff is 20, and the potential is unshifted. The ext_pot reply is that energy and the LAMMPS lj/cut force, F = -dE/dx, in metal units (eV, Angstrom). A start succeeds at or below -604.796307 plus 0.001 with fewer than 2000000 calls.
'''

[ini.Main]
job = "basin_hopping"
quiet = true
write_log = false
temperature = 14000
random_seed = 1

[ini.Potential]
potential = "ext_pot"

[ini."Basin Hopping"]
steps = 60000
displacement = 0.3
significant_structure = true
displacement_distribution = "gaussian"
swap_probability = 0.0

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 10000
