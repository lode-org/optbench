id = "sella/de-pt-island-tuned"
engine = "sella"
code = "Sella"
code_version = "2.6.0"
commit = "6cfb60cdb100a146c3c6f0587d5308b247aa8010"
algorithm = "Sella+NEB"
problem = "double-ended-saddle-search/pt-island"
task = "sella-neb"
profile = "adjusted"
reducer = "capped"
ranked = true
parameter_source = "archive"
note = "Sella refines the highest-energy image of this problem's tuned ASE band. Archived Sella trust region: eta 1e-6, gamma 0.4, delta0 1.3e-3, rho_inc 1.035, rho_dec 5, sigma_inc 1.15, sigma_dec 0.65. The band stops at 80 percent of the call cap and both stages share one harness counter. v0 is unset: a free cluster drops rigid modes, so a full Cartesian mode has the wrong length. Archive eon-ci-neb uses 3 intermediate images, climbing image, and LBFGS. The config does not set a spring, so the spring stays 0.1. The problem cap is 3000 force calls. The harness total stops at 10000, and the board scores this row at the problem cap."

[optimizer]
name = "Sella"

[optimizer.parameters]
order = 1
eta = 1e-06
gamma = 0.4
rho_inc = 1.035
rho_dec = 5.0
sigma_inc = 1.15
sigma_dec = 0.65
delta0 = 0.0013

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
rc = 7.0
form = "shift"
pbc = [true, true, false]

[stop]
norm = "fmax"
force_norm = 0.001
max_force_calls = 10000
max_steps = 1000

[input]
archive_path = "website/double-ended-saddle-search/pt-island/pt-island-con.tgz"

[neb]
layout = "reactant-products"
moving_images = 3
spring = 0.1
climb = true
method = "improvedtangent"
band_optimizer = "LBFGS"

[neb.band_parameters]
maxstep = 0.2

[sella]
order = 1
v0 = "none"
reserve = 0.2
