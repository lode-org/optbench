id = "gmin/lj98-bh"
engine = "gmin-bh"
problem = "globalopt/lj98"
code = "GMIN"
code_version = "latest"
commit = "latest"
algorithm = "basin-hopping with core-orbit symmetrisation"
tuning = "default"
failure_cap = 1000000000
note = "Serial basin-hopping with the archived lj98 symmetrise moves. One replica at temperature 1.3. BHPT is unset, so the MPI temperature reset keeps TEMPERATURE 1.3. Quenches are L-BFGS with SLOPPYCONV 0.007, TIGHTCONV 1.0e-5, and MAXIT 1000 and 1000. STEP is 0.46 and ASTEP is 0.47. FIXBOTH, PERMDIST 0.01, NEWRESTART 6, SORT, SAVE 1, and SYMMETRISE 1 0.01 0.05 0.3 0.1 0.6 3 0.3 2.1 are the archive data file. STEPS is 100000 1.0. The archive sets no RADIUS and no RANSEED. RADIUS is omitted and the coordinates are not translated before CENTRE. The cap and MAX_NPCALL are problems/globalopt/lj98.toml convergence.max_force_calls, 1000000000. EDIFF is 0.001, the problem energy_above_minimum. TARGET is the harness energy of codes/gmin/reference/lj98.points. The data file starts with MPI because the binary is the MPI build, and mpirun launches it. Starts are the 100 numbered coords files. The unnumbered coords file is not a start. A start that already succeeded keeps its call count."

[gmin]
method = "bh"
replicas = 1
temperature = 1.3
pttmin = 1.3
pttmax = 1.3
exchprob = 0.1
step = 0.46
astep = 0.47
sloppyconv = 0.007
tightconv = 1.0e-5
ediff = 0.001
maxit = 1000
maxit2 = 1000
radius = 0.0
steps = 100000
tfac = 1.0
seed = 0
emit_seed = false
center = false
save = 1
fixboth = true
permdist = 0.01
newrestart = 6
sort = true
symmetrise = "1 0.01 0.05 0.3 0.1 0.6 3 0.3 2.1"
