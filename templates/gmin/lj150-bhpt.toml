id = "gmin/lj150-bhpt"
engine = "gmin-bh"
problem = "globalopt/lj150"
code = "GMIN"
code_version = "latest"
commit = "latest"
algorithm = "parallel tempering basin-hopping"
tuning = "default"
failure_cap = 10000000
note = "Parallel tempering basin-hopping. Four replicas, temperatures geometric from 0.1 to 1, exchange probability 0.1. Quenches are L-BFGS with SLOPPYCONV 0.005, TIGHTCONV 0.001, MAXIT 600 and 500. STEP is 0.40 and ASTEP is 0.51. The container radius is 50 and the coordinates are translated to the origin, so the archived start is inside the container. CENTRE keeps the cluster at the origin. The random seed is 20261018 plus the start index. The failure cap is 10000000 harness calls, which is globalopt/lj150 max_force_calls. TARGET is the harness energy of codes/gmin/reference/lj150.points. EDIFF is 0.001, the problem energy_above_minimum. The data file starts with MPI because the binary is the MPI build, and mpirun launches it, including the one-replica run. Starts are the numbered coords files in the website tarball: 200 for lj75, 100 for lj98 and lj150. The unnumbered coords file is not a start."

[gmin]
method = "bhpt"
replicas = 4
temperature = 0.1
pttmin = 0.1
pttmax = 1.0
exchprob = 0.1
step = 0.40
astep = 0.51
sloppyconv = 0.005
tightconv = 0.001
ediff = 0.001
maxit = 600
maxit2 = 500
radius = 50.0
steps = 1000000
seed = 20261018
