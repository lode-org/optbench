id = "gmin/lj38-lbfgs"
engine = "gmin"
problem = "minimization/lj38"
code = "GMIN"
code_version = "latest"
commit = "latest"
algorithm = "LBFGS"
tuning = "default"
note = "Default GMIN LBFGS quench (MYMYLBFGS). Memory is 4, the initial inverse-Hessian diagonal is 0.1, the maximum Cartesian step is 0.4, and an energy rise above 1e-10 is rejected. These are the keyword defaults MUPDATE, DGUESS, MAXBFGS, and MAXERISE. The RMS stop is the problem force norm divided by sqrt(3N). The potential is the harness Lennard-Jones. ITMAX is the force-call cap. The same values are used for every start."

[gmin]
m = 4
maxbfgs = 0.4
dguess = 0.1
maxerise = 1.0e-10
maxefall = -1.0e300

[ini.Optimizer]
converged_force = 0.01
max_iterations = 10000
