id = "rgsaddle/develop-saddle-dimer-fire"
engine = "rgsaddle"
problem = "saddle-search/pt-island"
code = "rgsaddle"
code_version = "(develop aa6dd937)"
commit = "aa6dd9371d6a63103010a6829cb62c74a39c7ff1"
algorithm = "Dimer FIRE"
tuning = "default"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "fire"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.SaddleSearch]
min_mode_method = "dimer"
max_iterations = 1000
dr = 0.001
rotation_tol = 0.0001
max_rotations = 20
krylov_dim = 12
rotation_angle_tol = 0.0
difference = "forward"
mode_seed = "file"

[ini.Search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
displace_radius = 3.3
max_searches = 20000
