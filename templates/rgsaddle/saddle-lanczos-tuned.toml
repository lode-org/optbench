id = "rgsaddle/saddle-lanczos-tuned"
engine = "rgsaddle"
problem = "saddle-search/pt-island"
code = "rgsaddle"
code_version = "0.2.2"
commit = "38c3137f62ce1436d662bb37188a8d7cd2d789b8"
algorithm = "Lanczos L-BFGS"
tuning = "tuned"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.SaddleSearch]
min_mode_method = "lanczos"
dr = 0.001
rotation_tol = 0.001
max_rotations = 12
krylov_dim = 8
rotation_angle_tol = 0.0
difference = "forward"
mode_seed = "file"

[ini.Search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
rmsd_connect = 0.5
max_searches = 20000
