max_iterations = 10000

[ini.SaddleSearch]
min_mode_method = "dimer"
dr = 0.001
rotation_tol = 0.0001
max_rotations = 20
krylov_dim = 12
rotation_angle_tol = 0.0
difference = "forward"
mode_seed = "gradient"
