id = "rgsaddle/dimer-fire"
engine = "rgsaddle"
problem = "tsopt/LJ38"
code = "rgsaddle"
code_version = "0.2.2"
commit = "38c3137f62ce1436d662bb37188a8d7cd2d789b8"
algorithm = "Dimer FIRE"
tuning = "default"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "fire"
convergence_metric = "norm"
converged_force = 0.001
