id = "rgsaddle/saddle-dimer-rotskip"
engine = "rgsaddle"
problem = "saddle-search/pt-island"
code = "rgsaddle"
code_version = "0.2.2"
commit = "8fa0eb1559c92b6ae9d1de190e253787a183729d"
algorithm = "Dimer rotation-skip L-BFGS"
tuning = "default"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.SaddleSearch]
min_mode_method = "dimer"
dr = 0.001
rotation_tol = 0.0001
max_rotations = 20
krylov_dim = 12
rotation_angle_tol = 0.08726646259971647
difference = "forward"
mode_seed = "file"

[ini.Search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
max_searches = 20000
