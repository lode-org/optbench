id = "rgsaddle/saddle-dimer-lbfgs-tuned"
engine = "rgsaddle"
problem = "saddle-search/pt-island"
code = "rgsaddle"
code_version = "0.2.2"
commit = "2db34b42e6e029ebcf5b9868b94fcdf969103c9f"
algorithm = "Dimer L-BFGS"
tuning = "tuned"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.1
max_iterations = 1000

[ini.SaddleSearch]
min_mode_method = "dimer"
dr = 0.001
rotation_tol = 0.001
max_rotations = 10
krylov_dim = 12
rotation_angle_tol = 0.0
difference = "forward"
mode_seed = "file"

[ini.Search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
rmsd_connect = 0.5
max_searches = 20000
