id = "rgsaddle/pt-lanczos-tuned"
engine = "rgsaddle"
problem = "tsopt/pt-island"
code = "rgsaddle"
code_version = "0.2.2"
commit = "2db34b42e6e029ebcf5b9868b94fcdf969103c9f"
algorithm = "Lanczos L-BFGS"
tuning = "tuned"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 10000

[ini.SaddleSearch]
min_mode_method = "lanczos"
dr = 0.001
rotation_tol = 0.001
max_rotations = 12
krylov_dim = 8
rotation_angle_tol = 0.0
difference = "forward"
mode_seed = "reactant"
