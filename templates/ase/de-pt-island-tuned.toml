id = "ase/de-pt-island-tuned"
engine = "ase"
code = "ASE"
code_version = "3.29.0"
commit = "f27c0005ae6a67ea419f996e728668865bfc1f86"
algorithm = "NEB-LBFGS"
problem = "double-ended-saddle-search/pt-island"
task = "neb"
profile = "adjusted"
reducer = "capped"
ranked = true
parameter_source = "archive"
note = "Archive eon-ci-neb uses 3 intermediate images, climbing image, and LBFGS. The config does not set a spring, so the spring stays 0.1. The problem cap is 3000 force calls. The harness total stops at 10000, and the board scores this row at the problem cap."

[optimizer]
name = "LBFGS"

[optimizer.parameters]
maxstep = 0.2

[potential]
kind = "morse"
D = 0.7102
alpha = 1.6047
r0 = 2.897
rc = 7.0
form = "shift"
pbc = [true, true, false]

[stop]
norm = "fmax"
force_norm = 0.001
max_force_calls = 10000
max_steps = 1000

[input]
archive_path = "website/double-ended-saddle-search/pt-island/pt-island-con.tgz"

[neb]
layout = "reactant-products"
moving_images = 3
spring = 0.1
climb = true
method = "improvedtangent"
