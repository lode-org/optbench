id = "eon-client/mh-lj38"
engine = "eon"
problem = "globalopt/lj38"
code = "eOn"
code_version = "3.5.0"
commit = "4d8b34baf1ba8d2d980df29838bac1f969d1662c"
algorithm = "Minima hopping"
reducer = "harness"
failure_cap = 2000000
kind = "minima"
kernel = "lj40"
asv_class = "EonClientMhLj38"
note = '''
Minima hopping on the LJ38 starts. No 2014 eon minima-hopping ini is in the archive. steps 10000, move_method md, and decision_method npew are the r2549 defaults. target_energy is the basin-hopping stop, -173.927427. The job writes earr.dat and does not write results.dat. Success is the lowest earr energy below that target, with harness calls under 2000000. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
seeds = [314159]
asv_full = false
asv_timeout = 1800
budget_seconds = 1200

[[inputs]]
source = "archive/entries/globalopt/lj38/eon-basinhopping/in.lammps"
target = "in.lammps"

[ini.Main]
job = "global_optimization"
temperature = 8000
random_seed = 314159
finite_difference = 0.001

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Global Optimization"]
steps = 10000
move_method = "md"
decision_method = "npew"
target_energy = "-173.927427"
