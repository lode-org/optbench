id = "eon-client/htst-pt-lanczos-lbfgs"
engine = "eon"
problem = "hTST/Pt"
code = "eOn"
code_version = "3.5.0"
commit = "4d8b34baf1ba8d2d980df29838bac1f969d1662c"
algorithm = "Lanczos L-BFGS"
reducer = "harness"
failure_cap = 2000000
kind = "htst"
kernel = "morse"
asv_class = "EonClientHtstPtLanczosLbfgs"
note = '''
Bounded AKMC with Lanczos on the Pt hTST reactant. Tolerance 0.05, max_iterations 10. The displacement and confidence settings match the dimer-lbfgs template. The row is partial. The harness kernel is morse/smooth/linear with D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, and periodic boundaries in x and y.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/eon-lanczos-lbfgs/states/0/reactant.con"
pass_limit = 1
workers = 1
declare_partial = true
asv_timeout = 3600
budget_seconds = 2400

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42
finite_difference = 0.001

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1.2e12"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 5000
max_move = 0.2
lbfgs_memory = 20

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 2
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
displace_least_coordinated_weight = 1
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "lanczos"
max_energy = 1000
max_iterations = 5000
converged_force = 0.001

[ini.Dimer]
rotations_max = 50
converged_angle = 1
opt_method = "cg"
improved = true

[ini.Lanczos]
tolerance = 0.05
max_iterations = 10
quit_early = true
