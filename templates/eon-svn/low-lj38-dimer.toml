id = "eon-svn/low-lj38-dimer"
engine = "eon-client"
problem = "lowest-eigenvector/lj38"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer"
reducer = "harness"
kernel = "ljcluster"
failure_cap = 10000
tuning = "default"
note = """Lowest mode of the 200 LJ38 geometries, same protocol as eon/develop-low-lj38-dimer. Saddle Search max_iterations is 0. Improved dimer, rotation conjugate gradient, converged_angle 0. The harness raises rotations_max from 1 and keeps the first run whose absolute overlap with the reference mode is at least 0.99. The recorded calls are that run. Potential ljcluster. direction.dat is the numpy seed 314159 mode. client_displace_type load. Main random_seed is 1. The run swaps the potential for ext_pot. The harness kernel is the develop kernel for this potential name. The 2014 table used r2156. The binary is SVN r2549, the registry pin. Export of the 2014 revision is forbidden, so this row is r2549."""

overlap = 0.99
iteration_limit = 1000

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini."Saddle Search"]
max_iterations = 0
min_mode_method = "dimer"
client_displace_type = "load"
displace_magnitude = 0.1

[ini.Dimer]
improved = true
opt_method = "cg"
converged_angle = 0
rotations_max = 1
rotations_min = 1
