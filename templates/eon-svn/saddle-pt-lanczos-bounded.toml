id = "eon-svn/saddle-pt-lanczos-bounded"
engine = "eon"
problem = "saddle-search/pt-island"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos L-BFGS"
reducer = "harness"
failure_cap = 20000000
kind = "akmc"
kernel = "morse"
asv_class = "EonSvnSaddlePtLanczosBounded"
note = '''
This id is separate from eon-svn/saddle-pt-lanczos. That row uses pass_limit 250 and seeds 1000 and 1001 on r2549 Morse::force. This row uses pass_limit 4 and seed 0 on morse/smooth/linear.
AKMC with Lanczos. Tolerance 0.001, max_iterations 20, quit_early true. The other process-search settings match the dimer template. pass_limit 4, seed 0, partial. The harness kernel is morse/smooth/linear with D 0.7102, alpha 1.6047, r0 2.897, cutoff 9.5, and periodic boundaries in x and y.
'''
seeds = [0]
starts = ["pt-island"]
pass_limit = 4
workers = 1
declare_partial = true
asv_timeout = 3600
budget_seconds = 2400

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 8
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = "5e12"

[ini.Dimer]
improved = true
opt_method = "cg"
converged_angle = 5
rotations_max = 20
rotations_min = 1

[ini.Lanczos]
tolerance = 0.001
max_iterations = 20
quit_early = true
