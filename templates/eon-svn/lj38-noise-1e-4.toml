id = "eon-svn/lj38-noise-1e-4"
engine = "eon-client"
problem = "minimization/lj38-noise"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "LBFGS"
reducer = "harness"
kernel = "lj_cut"
failure_cap = 10000
tuning = "default"
note = """L-BFGS memory 20 on the 1000 LJ38 starts at force sigma 1e-4. Settings match eon-svn/lbfgs-m20 except the potential: unshifted lj/cut, epsilon 1, sigma 1, cutoff 40, which is the problem potential, not lj_cluster. converged_force in this file is the clean tolerance 0.01. The run sets the client tolerance to max(0.01, 3 * sigma * sqrt(114)). When sigma is positive, a force sample under that threshold is held above it until the clean energy over the last 5 evaluations spans at most max(1e-10, 3 * sigma). The seed for start i is 20261016 + i. Success also requires a clean vibrational Hessian index of 0, with the six rigid modes removed. Energy and Kabsch RMSD are not applied: the problem file has no per-start reference. r2549 does not read energy_weighted, ci_mmf, climbing_image_band_slack, setup_mmf_peaks, or the develop L-BFGS catalog past memory, inverse curvature, max inverse curvature, auto scale, and the two resets. Those keys are omitted. The keys it does read sit in [Optimizer]. The binary is SVN r2549, the registry pin. Export of the 2014 revision is forbidden, so this row is r2549."""

noise_sigma = 0.0001
noise_kappa = 3.0
noise_window = 5
noise_seed = 20261016

[ini.Main]
job = "minimization"
finite_difference = 0.01
random_seed = 1

[ini.Potential]
potential = "lj_cut"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.01
max_move = 0.2
max_iterations = 10000
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true
