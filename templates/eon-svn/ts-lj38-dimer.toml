id = "eon-svn/ts-lj38-dimer"
engine = "eon-client"
problem = "tsopt/LJ38"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "LBFGS"
reducer = "harness"
kernel = "ljcluster"
failure_cap = 10000
tuning = "default"
note = """Improved dimer, same stops as eon/develop-ts-lj38-dimer. Memory 20, translation L-BFGS max_move 0.1, max_iterations 3000, converged_force 0.001. Dimer rotation is conjugate gradient, converged_angle 0.1, rotations_max 20, improved true. Potential ljcluster. client_displace_type load. direction.dat is Python random.Random(index). Main random_seed is 1. r2549 does not read energy_weighted, ci_mmf, climbing_image_band_slack, setup_mmf_peaks, or the develop L-BFGS catalog past memory, inverse curvature, max inverse curvature, auto scale, and the two resets. Those keys are omitted. The keys it does read sit in [Optimizer]. The run swaps the potential for ext_pot. The harness kernel is the develop kernel for this potential name. The 2014 table used r2156. The binary is SVN r2549, the registry pin. Export of the 2014 revision is forbidden, so this row is r2549."""


[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.1
max_iterations = 3000
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true

[ini."Saddle Search"]
min_mode_method = "dimer"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 3000
displace_magnitude = 0.1

[ini.Dimer]
opt_method = "cg"
improved = true
finite_angle = 0.005
converged_angle = 0.1
rotations_max = 20
rotations_min = 1
