id = "eon-svn/de-2ts-ci"
engine = "eon-client"
problem = "double-ended-saddle-search/lj38_2ts_separation"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "LBFGS"
reducer = "harness"
kernel = "ljcluster"
