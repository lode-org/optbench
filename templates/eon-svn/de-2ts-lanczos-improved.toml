id = "eon-svn/de-2ts-lanczos-improved"
engine = "eon"
problem = "double-ended-saddle-search/lj38_2ts_separation"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos improved L-BFGS"
reducer = "harness"
failure_cap = 10000
kind = "de-2ts-mode"
kernel = "lj40"
asv_class = "EonSvnDe2tsLanczosImproved"
note = '''
No 2014 eon config is in the archive for this problem. The band uses the LJ38 climbing-image settings and this file's failure_cap of 10000 force calls, five interior images, and converged_force 0.001. Lanczos max_iterations 20, tolerance 0.05, quit_early true. The harness kernel is unshifted lj/cut with epsilon 1, sigma 1, and cutoff 40.
'''
seeds = [1]
asv_timeout = 1200
budget_seconds = 900

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "lammps"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.1
max_iterations = 1000
lbfgs_memory = 20

[ini.LBFGS]
lbfgs_memory = 20

[ini."Saddle Search"]
min_mode_method = "lanczos"
client_displace_type = "load"
converged_force = 0.001
max_iterations = 1000
displace_magnitude = 0.1
max_energy = 1000000000

[ini.Lanczos]
max_iterations = 20
tolerance = 0.05
quit_early = true
