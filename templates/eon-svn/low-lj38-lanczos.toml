id = "eon-svn/low-lj38-lanczos"
engine = "eon-client"
problem = "lowest-eigenvector/lj38"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos"
reducer = "harness"
kernel = "ljcluster"
failure_cap = 10000
tuning = "default"
note = """Lowest mode of the 200 LJ38 geometries, same protocol as eon/develop-low-lj38-lanczos. Saddle Search max_iterations is 0. Lanczos tolerance is 0 and quit_early is false. The harness raises Lanczos max_iterations from 1 and keeps the first run whose absolute overlap is at least 0.99. Potential ljcluster. direction.dat is the numpy seed 314159 mode. Main random_seed is 1. The run swaps the potential for ext_pot. The harness kernel is the develop kernel for this potential name. The 2014 table used r2156. The binary is SVN r2549, the registry pin. Export of the 2014 revision is forbidden, so this row is r2549."""

overlap = 0.99
iteration_limit = 1000

[ini.Main]
job = "saddle_search"
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "ljcluster"

[ini."Saddle Search"]
max_iterations = 0
min_mode_method = "lanczos"
client_displace_type = "load"
displace_magnitude = 0.1

[ini.Lanczos]
tolerance = 0
max_iterations = 1
quit_early = false
