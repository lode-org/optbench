id = "eon-svn/saddle-pt-lanczos"
engine = "eon-client"
problem = "saddle-search/pt-island"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Lanczos"
reducer = "harness"
kernel = "morse_shift"
failure_cap = 100000000
tuning = "default"
note = """AKMC on the Pt island until 27 good saddles below 1.5 eV. Same thermostat, displacement list, prefactor, and L-BFGS translation as eon/develop-saddle-pt-lanczos. The minimum mode is Lanczos, tolerance 0.001, max_iterations 20, quit_early true. Seeds are 1000 and 1001. pass_limit 250. r2549 does not read energy_weighted, ci_mmf, climbing_image_band_slack, setup_mmf_peaks, or the develop L-BFGS catalog past memory, inverse curvature, max inverse curvature, auto scale, and the two resets. Those keys are omitted. The keys it does read sit in [Optimizer]. The run swaps the potential for ext_pot. The harness kernel is r2549 Morse::force: cutoff 9.5, pair energy shifted to zero at the cutoff, minimum image on the box diagonal. The 2014 saddle table has no Lanczos eOn row. The binary is SVN r2549, the registry pin. Export of the 2014 revision is forbidden, so this row is r2549."""

pass_limit = 250

[ini.Main]
job = "akmc"
temperature = 700
finite_difference = 0.001
random_seed = 1

[ini.Potential]
potential = "morse_pt"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000
lbfgs_memory = 20
lbfgs_inverse_curvature = 0.01
lbfgs_max_inverse_curvature = 0.0
lbfgs_auto_scale = true
lbfgs_angle_reset = true
lbfgs_distance_reset = true

[ini.AKMC]
confidence = 1.1
thermally_accessible_window = 99999
confidence_scheme = "old"

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 32
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
min_mode_method = "lanczos"
displace_listed_atom_weight = 1
displace_atom_list = "0,1,2,3,4,5,6"
displace_radius = 3.3
displace_magnitude = 0.1
max_energy = 5.0
max_iterations = 1000
converged_force = 0.001

[ini.Prefactor]
default_value = 5e12

[ini.Lanczos]
tolerance = 0.001
max_iterations = 20
quit_early = true
