id = "eon-svn/htst-pt-dimer-lbfgs"
engine = "eon"
problem = "hTST/Pt"
code = "Eon svn"
code_version = "r2549"
commit = "r2549"
algorithm = "Dimer L-BFGS"
reducer = "harness"
failure_cap = 2000000
kind = "htst"
kernel = "morse_shift"
asv_class = "EonSvnHtstPtDimerLbfgs"
note = '''
Bounded AKMC on the Pt hTST reactant. Temperature 700, confidence 1.9, prefactor 1.2e12, LBFGS, dimer rotations_max 50, converged_angle 1, displace_least_coordinated_weight 1, radius 3.3, magnitude 0.3, seed 42. num_jobs is 2. Success is one good saddle during the pass, not the 2014 rate sum. The row is partial. The harness kernel is r2549 Morse::force: cutoff 9.5, pair energy shifted to zero at the cutoff, minimum image on the box diagonal. D 0.7102, alpha 1.6047, r0 2.897.
'''
seeds = [42]
starts = ["pt"]
geometry = "website/hTST/Pt/eon-dimer-lbfgs/pos.con"
pass_limit = 1
workers = 1
declare_partial = true
asv_timeout = 3600
budget_seconds = 2400

[ini.Main]
job = "akmc"
temperature = 700
random_seed = 42
finite_difference = 0.001

[ini.Potential]
potential = "morse_pt"

[ini.Prefactor]
default_value = "1.2e12"

[ini.Optimizer]
opt_method = "lbfgs"
converged_force = 0.001
max_iterations = 5000
max_move = 0.2
lbfgs_memory = 20

[ini.AKMC]
confidence = 1.9

[ini."Process Search"]
minimize_first = true

[ini.Communicator]
type = "local"
num_jobs = 2
number_of_CPUs = 1
client_path = "eonclient"

[ini."Saddle Search"]
displace_least_coordinated_weight = 1
displace_radius = 3.3
displace_magnitude = 0.3
min_mode_method = "dimer"
max_energy = 1000
max_iterations = 5000
converged_force = 0.001

[ini.Dimer]
rotations_max = 50
converged_angle = 1
opt_method = "cg"
improved = true
