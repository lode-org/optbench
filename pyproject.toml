[project]
name = "optbench"
version = "0.0.0"
description = "Replay the OptBench geometry and saddle suites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cyclopts>=3.24", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
optbench = "optbench.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "asv==0.6.6",
    "asv-runner==0.3.1",
    "geodesic-interpolate @ git+https://github.com/virtualzx-nad/geodesic-interpolate.git@476aa041f562d37d5fb4121b86817a52d75e4c5d",
    "ase==3.29.0",
]
campaign = [
    "ase==3.29.0",
    "sella==2.6.0",
    "numpy",
    "scipy",
    "geodesic-interpolate @ git+https://github.com/virtualzx-nad/geodesic-interpolate.git@476aa041f562d37d5fb4121b86817a52d75e4c5d",
    "optking",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optbench"]

[tool.hatch.build.targets.wheel.force-include]
"optbench/extpot_bridge.c" = "optbench/extpot_bridge.c"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
optking = { git = "https://github.com/psi-rking/optking.git", rev = "767e2c0c13ff2b851ac82101ccd5aab9a558a4f1" }
