[[code]]
id = "lammps"
name = "LAMMPS"
role = "minimization and accelerated dynamics"
repository = "https://github.com/lammps/lammps"
ref = "stable_30Sep2026"
commit = "8de817dd79bfe4525d5d39246a212d833e6dee07"
committed = "2026-09-30"
note = "stable_30Sep2026. Minimizers cg, sd, hftn, quickmin, and fire call the harness through fix external pf/callback and pair_style zero. NEB, PRD, TAD, and hyper are not scored. The Al and Pt problems need EAM, and the harness has no EAM evaluator. A native pair_style tally is not the score."

[[code]]
id = "dlfind"
name = "DL-FIND"
role = "minimization"
repository = "https://github.com/digital-chemistry-laboratory/libdlfind"
ref = "0.0.3"
commit = "4167998d16d8dac4a484ba9305f27d6325a7a28d"
committed = "2024-04-06"
note = "libdlfind 0.0.3. iopt 3 is L-BFGS, 0 is steepest descent, and 1 is conjugate gradient. The gradient callback is the harness score. NEB and the dimer are separate tasks and are not in these rows."

[[code]]
id = "compass"
name = "COMPASS"
role = "double-ended saddle search"
repository = "https://gitlab.com/goedeckergroup/compass"
ref = "1.0.0"
commit = "22da7bd5f69cbd64d59853c8f8d7f8d44c2d18df"
committed = "2024-08-08"
note = "COMPASS 1.0.0, commit 22da7bd. The ASE calculator is the harness score. forcetol and the endpoint minimize_fmax are the problem force stop. The cell is held fixed: the library treats any periodic boundary as a variable cell. The chain is COMPASS's own."

[[code]]
id = "pysisyphus"
name = "pysisyphus"
role = "minimization and mode following"
repository = "https://github.com/eljost/pysisyphus"
ref = "master"
commit = "a4ce10dd6d7fdcb3d813f1c730eb365d29041999"
committed = "2025-10-29"
note = "Commit a4ce10dd, 2025-10-29. The clone has no tag, so the installed package reports 0.1.dev1. GPL-3.0. Cartesian L-BFGS, conjugate gradient, and steepest descent use the library defaults. The RMS stop is the Euclidean force stop divided by sqrt of the Cartesian components. Lanczos uses dx 5e-3 and dl 1e-2. The harness calculator is the score. The dimer and NEB are not in these rows."

[[code]]
id = "optim"
name = "OPTIM"
role = "saddle search"
repository = "http://www-wales.ch.cam.ac.uk/svn.tar.bz2"
ref = "svn-snapshot"
commit = "02aaf45245af7b521b5792fa77ffa364f67d756327ea9e4ecf580c4b6f83e24f"
note = "No public git commit. The pin is the sha256 of the Wales svn.tar.bz2 snapshot, 122743078 bytes. Minimization L-BFGS calls the ASE socket and pes.evaluate. OPTIM's own call counter is not a score. Saddle search, NEB, noise, and PATHSAMPLE are not scored."

[[code]]
id = "airss"
name = "AIRSS"
role = "random structure search"
repository = "https://www.mtg.msm.cam.ac.uk/Codes/AIRSS"
ref = "0.9.4"
commit = "5593cc4ee360d998764fceb188284fdf0ef781d206754176dcb360c65103ddaa"
committed = "2023-06"
note = "Version 0.9.4, June 2023. The commit is the sha256 of https://www.mtg.msm.cam.ac.uk/files/airss-v0.9.4.tgz. buildcell from that tarball draws the cells. The scored relaxation is the pp3 two-point step on the harness Lennard-Jones potential."

[[code]]
id = "vcsqnm"
name = "vc-SQNM"
role = "minimization"
repository = "https://github.com/moritzgubler/vc-sqnm"
ref = "v1.3"
commit = "4241692173cccb42a9ae05974bfd62285ec2cd7b"
committed = "2025-03-28"
note = "Tag v1.3. The Python distribution built from that commit reports version 1.2. Rows use that package: SQNM, vc-SQNM, and aseOptimizer. The C++ and Fortran mains call the Bazant potential and are not these scores. initial_step_size is -1e-7, alpha_min is 1e-3, and eps_subsp is 1e-5. The wrapper constructor uses -0.01 and eps_subsp 1e-3. Both of those leave some LJ38 starts outside the cutoff. Variable-cell rows are Morse bulk. The spec Lennard-Jones potential has no cell."

[[code]]
id = "softsaddle"
name = "SoftSaddle"
role = "saddle search"
repository = "https://github.com/henkelmangroup/optbench"
ref = "website/codes/softsaddle.tar.gz"
commit = "5a00aeede06fd822ef302624ec4c9bc7889d21fc0b5804b701a5785695c68d16"
committed = "2019-04-01"
note = "April 2019 adaptive hypersphere with LBFGS memory 60, from softsaddle.tar.gz sha256 5a00aeed. Lanczos and Davidson are the bundled C++ solvers, built without the Morse library, and the harness potential supplies every gradient. Davidson keeps its 525-coordinate Pt minimum Hessian anchor and uses the current point for any other dimension. Saddle rows are one repetition of the sm50 Davidson walk and the sm0 and sm50 Lanczos walks, stopped at 27 connected saddles. Lowest-eigenvector rows repeat the same eigen-solver from the gradient until overlap 0.99."

[[code]]
id = "lammpsneb"
name = "LAMMPS"
role = "saddle search"
repository = "https://github.com/lammps/lammps"
ref = "stable_30Sep2026"
commit = "8de817dd79bfe4525d5d39246a212d833e6dee07"
committed = "2026-09-30"
note = "LAMMPS 30 Sep 2026, tag stable_30Sep2026. Band rows use fix neb with a climbing stage and min_style quickmin or fire. The pair style is the spec potential: lj/cut 40 with no shift, and morse 9.5 with pair_modify shift yes. Kspring is 1.0 with the default parallel neigh spring. The timestep is the unit default. Force calls are pair computes summed across replicas. The FIRE row leaves one fifth of the cap unused so a velocity-reset evaluation stays inside the cap."

