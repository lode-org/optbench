commit = "6cfb60cdb100a146c3c6f0587d5308b247aa8010"
committed = "2026-10-15"
note = "Sella 2.6.0. Order 1 is a saddle and order 0 is a minimum. The Sella 0.1.1 rows on the 2014 tables are legacy and are not this pin. Force calls are harness calculator evaluations."

[[code]]
id = "gmin"
name = "GMIN"
role = "minimization"
repository = "https://www-wales.ch.cam.ac.uk/svn.tar.bz2"
ref = "svn.tar.bz2"
commit = "df8da599267534fbe43a250e578f7396a7946311"
committed = "2026-10-18"
note = "Wales group GMIN. Tarball sha256 02aaf45245af7b521b5792fa77ffa364f67d756327ea9e4ecf580c4b6f83e24f. SVNREV df8da599267534fbe43a250e578f7396a7946311, fetched 2026-10-18. The quench is source/mymylbfgs.F90. Keyword defaults are MUPDATE 4, DGUESS 0.1, MAXBFGS 0.4, and MAXERISE 1e-10. The RMS tolerance is the Euclidean force norm divided by sqrt(3N). The potential is the harness Lennard-Jones or Morse through POTENTIAL. Force calls are HarnessCounter entries."

[[code]]
id = "pele"
name = "pele"
role = "minimization"
repository = "https://github.com/pele-python/pele"
ref = "main"
commit = "b7081b932a060be11342fbe8287ac35da8ada879"
committed = "2026-10-12"
note = "0.1.2 at main b7081b93, built from source. LBFGS and FIRE are the Python classes. MYLBFGS is the Fortran step update on that LBFGS. Steepest descent is the update in pele.optimize.steepest_descent. Campaigns call the harness Lennard-Jones or Morse potential. Force calls are harness entries to getEnergyGradient. The 2014 rows counted nfev on pele's own potential and stay on the archive table."

[[code]]
id = "optking"
name = "OptKing"
role = "transition-state search"
repository = "https://github.com/psi-rking/optking"
ref = "767e2c0c13ff2b851ac82101ccd5aab9a558a4f1"
commit = "767e2c0c13ff2b851ac82101ccd5aab9a558a4f1"
committed = "2026-10-13"
note = "Geometry optimizer at 767e2c0c13ff2b851ac82101ccd5aab9a558a4f1. The version string is 0.5.1.dev2+g767e2c0c1. Transition-state steps on this revision are RS_I_RFO and P_RFO. RS_PRFO is a comment on the RFO base class and is not a step type. The Lennard-Jones 38 and Pt-island rows use Cartesian coordinates and one initial harness Hessian. A Hessian is the central difference of the harness gradient, and those evaluations are force calls."

[[code]]
id = "artn"
name = "pARTn"
role = "saddle search"
repository = "https://gitlab.com/mammasmias/artn-plugin"
ref = "DEVEL"
commit = "9b753517c6c0eccae51425b83eb4e04ef554550b"
committed = "2026-10-05"
note = "pARTn 1.1.0 at DEVEL 9b753517. The standalone search and the engine plugin are libartn.so. The harness calls pypARTn.artn(engine=other) and next_displ. Licences in the tree are GPL-3.0 and Apache-2.0. nevalf is not the score."

[[code]]
id = "tsase"
name = "TSASE"
role = "saddle search"
repository = "https://github.com/henkelmangroup/tsase"
