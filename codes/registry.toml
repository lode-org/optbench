[[code]]
id = "eon-svn"
name = "Eon svn"
role = "minimization and saddle search"
repository = "https://theory.cm.utexas.edu/svn/eon"
ref = "r2549"
commit = "r2549"
committed = "2026-01-23"
note = "SVN revision 2549, last changed 2026-01-23 by eboniw. eonclient -v prints r2549. The 2014 tables used earlier revisions. Export of those trees is forbidden, so the runs here are r2549. QSC sources are not in the revision. LAMMPS is not linked. Min-mode methods in this revision are dimer and lanczos. One harness uses r2549 Morse::force: cutoff 9.5, pair energy shifted to zero at the cutoff, minimum image on the box diagonal. The lane harness uses unshifted lj/cut and morse/smooth/linear. github.com/henkelmangroup/eon mirrors the same tree. The conda-forge 3.5.0 binary is a different pin. The name is Eon svn so it does not collide with the git eOn pins."

[[code]]
id = "rgmin"
name = "rgmin"
role = "minimization"
repository = "https://github.com/OmniPotentRPC/rgmin"
ref = "fix/default-cap-per-method"
commit = "f15726f1c7983b3656c5dbc2f812e2394e144500"
committed = "2026-10-17"
note = "Minimizers, version 0.4.1, branch fix/default-cap-per-method. A Lennard-Jones 38 entry uses the harness force counter. L-BFGS memory defaults to 10. BFGS, dogleg, and FIRE 2.0 start without the 0.2 per-atom cap. The other Cartesian methods start at 0.2. An explicit cap still applies. SR1 and SR2 step in a trust region sized to that cap. DIIS searches the GDIIS image. Adam scales its direction to unit per-atom length."

[[code]]
id = "rgsaddle"
name = "rgsaddle"
role = "saddle search"
repository = "https://github.com/OmniPotentRPC/rgsaddle"
ref = "main"
commit = "38c3137f62ce1436d662bb37188a8d7cd2d789b8"
committed = "2026-10-21"
note = "0.2.2 at main 38c3137f, the merge of pull request 21. Band and min-mode sessions on this main. Stencil.band presets are not built here; the campaign calls the C band and min-mode API. OCI-NEB is CI-NEB followed by a min-mode refinement. The min-mode translator keeps its step memory inside the mode cone, and an order-1 free Hessian follows a kept Lanczos basis. Dimer, Lanczos, and P-RFO templates pin this commit. Campaign files scored at c0db2b8d keep that commit on their row. Nonlinear CG is refused by check_force_driven; the min-mode translators are L-BFGS and FIRE."

[[code]]
id = "geodesic"
name = "geodesic"
role = "band initialiser"
repository = "https://github.com/virtualzx-nad/geodesic-interpolate"
ref = "main"
commit = "476aa041f562d37d5fb4121b86817a52d75e4c5d"
committed = "2026-06-01"
note = "geodesic-interpolate 1.0.0 at 476aa041. This pin is the initial path for the ASE and rgsaddle NEB templates, an initialiser ablation. The smoother uses the package command-line defaults: scaling 1.7, distance cutoff 3, friction 0.01, tolerance 0.002, 15 iterations, and a sweep above 35 atoms. It does not evaluate the spec potential, so its steps are not force calls. The archive symbols A and Pt are absent from the radius table and use the library fallback radius 1.5."

[[code]]
id = "ase"
name = "ASE"
role = "minimization and saddle search"
repository = "https://gitlab.com/ase/ase"
ref = "3.29.0"
commit = "f27c0005ae6a67ea419f996e728668865bfc1f86"
committed = "2026-10-15"
note = "Atomic Simulation Environment 3.29.0. BFGS, LBFGS, FIRE, BFGSLineSearch, GPMin, PreconLBFGS, PreconFIRE, and PreconODE12r, plus NEB and dimer. Force calls are harness calculator evaluations."

[[code]]
id = "sella"
